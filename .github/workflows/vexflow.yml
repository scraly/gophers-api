name: VEX Triage

on:
  # Run on pushes to main to pick up dependency changes
  push:
    branches: [main]
  # Run on a schedule to process new slash commands
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours, adjust as needed
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write
  attestations: write

jobs:
  vexflow-update:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Install vexflow
        run: go install github.com/carabiner-dev/vexflow@latest

      - name: Run vexflow update
        env:
          GITHUB_TOKEN: ${{ secrets.VEXFLOW_TOKEN }}
        run: |
          vexflow update \
            --repo sherine-k/gophers-api \
            --branch main \
            --triage-repo sherine-k/.vexflow